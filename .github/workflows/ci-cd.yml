name: AI Agent CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ai-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Run Flake8
        run: python -m flake8 .

      - name: Verify FastAPI application imports
        run: python -c "from main import app; assert app.title"

      - name: Validate production container build
        run: docker build --tag quinta-ai-agent:${{ github.sha }} .

  deploy:
    name: Trigger production deployment
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Railway or Render deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || {
            echo "DEPLOY_HOOK_URL repository secret is not configured."
            exit 1
          }
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            "$DEPLOY_HOOK_URL"
