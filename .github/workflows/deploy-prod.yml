name: Deploy AI Agent to Azure (Prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build, Publish & Deploy (Prod)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lowercase image name for GHCR compliance
      - name: Set up Image Metadata
        id: meta
        run: |
          IMAGE_BASE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          TAG="prod-${GITHUB_SHA}"
          echo "image=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE_BASE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:prod-latest
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Authenticate runner with Azure via Service Principal credentials
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Execute production deployment script with prod parameters
      - name: Deploy to Azure Container Apps (Prod)
        run: |
          chmod +x scripts/deploy-ai-agent.sh
          ./scripts/deploy-ai-agent.sh "${{ steps.meta.outputs.tag }}"
        env:
          RESOURCE_GROUP: "TalentMatch-RG"
          LOCATION: "eastasia"
          ENVIRONMENT_NAME: "cae-skillhub-prod"
          APP_NAME: "ca-skillhub-ai-agent-prod"
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_PROD || secrets.GROQ_API_KEY }}
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL_PROD || secrets.BACKEND_API_URL_PROD || 'https://ca-skillhub-backend.bravebay-18c4a18e.eastasia.azurecontainerapps.io' }}
