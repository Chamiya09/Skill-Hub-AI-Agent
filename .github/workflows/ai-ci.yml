name: AI Agent CI

on:
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all style warnings without breaking the build
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Smoke Test FastAPI App Initialization
        run: |
          python -c "from main import app; assert app.title == 'AI Agent Services'"

      - name: Run Pytest
        run: |
          # Run tests; if no test files exist yet (pytest exit code 5), don't fail the CI run
          python -m pytest || [ $? -eq 5 ]
